<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img"
     aria-label="Fluxograma da versão Metal: início, ler argumentos, criar a simulação, prescanMaps, gpu.initialize; para cada jogo o parse do mapa escreve direto no MTLBuffer e o kernel fillSelfLoops é enfileirado; depois finish, uploadMetadata, seedAgents e turno igual a zero; enquanto turno menor que 600, monta um command buffer, zera a máscara por blit, despacha markInfected e stepAgents no mesmo encoder e faz commit sem esperar; ao terminar, conta os estados na CPU sobre a memória unificada, imprime o CSV e encerra.">

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.4" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c5d2e0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#4b6079"/>

  <text x="40" y="30" font-family="Archivo, Lato, sans-serif" font-size="19" font-weight="700" fill="#f4f7fa">Fluxograma &#8212; versão Metal</text>

  <g font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11">
    <rect x="1060" y="20" width="10" height="10" fill="#6ad6b1"/>
    <text x="1076" y="29" fill="#c5d2e0">kernel na GPU</text>
    <rect x="1180" y="20" width="10" height="10" fill="#f2bd58"/>
    <text x="1196" y="29" fill="#c5d2e0">host</text>
  </g>

  <g stroke="#c5d2e0" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M220 84 L220 100"/>
    <path d="M220 142 L220 160"/>
    <path d="M220 210 L220 228"/>
    <path d="M220 278 L220 296"/>
    <path d="M220 346 L220 366 L380 366 L380 86 L494 86"/>
    <path d="M620 110 L620 132"/>
    <path d="M620 182 L620 204"/>
    <path d="M620 254 L620 276"/>
    <path d="M620 320 L620 342"/>
    <path d="M620 386 L620 408"/>
    <path d="M620 458 L620 480"/>
    <path d="M620 530 L620 552"/>
    <path d="M500 298 L470 298 L470 86 L494 86"/>
    <path d="M620 590 L620 612 L420 612 L420 404 L220 404 L220 410"/>
    <path d="M220 492 L220 512"/>
    <path d="M220 552 L220 572"/>
    <path d="M220 610 L220 630"/>
    <path d="M332 452 L374 452"/>
    <path d="M960 58 L960 70"/>
    <path d="M960 112 L960 134"/>
    <path d="M960 184 L960 206"/>
    <path d="M960 256 L960 278"/>
    <path d="M960 332 L960 354"/>
    <path d="M960 398 L960 420"/>
    <path d="M960 462 L960 478"/>
    <path d="M74 452 L106 452"/>
  </g>

  <!-- ================= coluna A ================= -->
  <g font-family="Archivo, Lato, sans-serif" text-anchor="middle">
    <rect x="145" y="50" width="150" height="34" rx="17" fill="#57708c" stroke="#c5d2e0" stroke-width="1.6"/>
    <text x="220" y="72" font-size="14" font-weight="600" fill="#f4f7fa">INÍCIO</text>

    <rect x="90" y="100" width="260" height="42" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="220" y="126" font-size="13" fill="#f4f7fa">Ler argumentos</text>

    <rect x="90" y="160" width="260" height="50" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="220" y="182" font-size="13" fill="#f4f7fa">Criar Simulation</text>
    <text x="220" y="200" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">20 jogos, 22.000.000 agentes</text>

    <rect x="90" y="228" width="260" height="50" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="220" y="250" font-size="13" fill="#f4f7fa">prescanMaps</text>
    <text x="220" y="268" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">ler só os cabeçalhos</text>

    <rect x="90" y="296" width="260" height="50" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="220" y="318" font-size="13" fill="#f4f7fa">gpu.initialize</text>
    <text x="220" y="336" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">metallib, pipelines, buffers</text>

    <polygon points="220,412 332,452 220,492 108,452" fill="#4b6079" stroke="#f2bd58" stroke-width="1.8"/>
    <text x="220" y="457" font-size="13" fill="#f4f7fa">turno &lt; 600 ?</text>

    <rect x="90" y="512" width="260" height="40" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="220" y="537" font-size="13" fill="#f4f7fa">Contar estados na CPU</text>

    <polygon points="112,572 350,572 328,610 90,610" fill="#57708c" stroke="#7d94ad"/>
    <text x="220" y="596" font-size="13" fill="#f4f7fa">Imprimir CSV</text>

    <rect x="145" y="630" width="150" height="34" rx="17" fill="#57708c" stroke="#c5d2e0" stroke-width="1.6"/>
    <text x="220" y="652" font-size="14" font-weight="600" fill="#f4f7fa">FIM</text>

    <circle cx="60" cy="452" r="14" fill="#4b6079" stroke="#c5d2e0" stroke-width="1.6"/>
    <text x="60" y="457" font-size="13" font-weight="600" fill="#f4f7fa">A</text>

    <circle cx="390" cy="452" r="14" fill="#4b6079" stroke="#c5d2e0" stroke-width="1.6"/>
    <text x="390" y="457" font-size="13" font-weight="600" fill="#f4f7fa">B</text>
  </g>

  <!-- ================= coluna B: mapas e semeadura ================= -->
  <g font-family="Archivo, Lato, sans-serif" text-anchor="middle">
    <polygon points="516,62 724,62 740,86 724,110 516,110 500,86" fill="#57708c" stroke="#6ad6b1" stroke-width="1.8"/>
    <text x="620" y="82" font-size="13" fill="#f4f7fa">para cada jogo</text>
    <text x="620" y="100" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#6ad6b1">0 .. 19, parallel for</text>

    <rect x="500" y="132" width="240" height="50" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="620" y="154" font-size="13" fill="#f4f7fa">Parse do mapa</text>
    <text x="620" y="172" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">direto no MTLBuffer</text>

    <rect x="500" y="204" width="240" height="50" rx="2" fill="#57708c" stroke="#6ad6b1" stroke-width="1.6"/>
    <text x="620" y="226" font-size="13" fill="#f4f7fa">fillSelfLoops</text>
    <text x="620" y="244" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">auto-laço nos slots vazios</text>

    <rect x="500" y="276" width="240" height="44" rx="2" fill="#4b6079" stroke="#6ad6b1" stroke-width="1.6"/>
    <text x="620" y="296" font-size="13" fill="#f4f7fa">fim do laço</text>
    <text x="620" y="313" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">próximo jogo</text>

    <rect x="500" y="342" width="240" height="44" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="620" y="362" font-size="13" fill="#f4f7fa">gpu.finish</text>
    <text x="620" y="379" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">esperar a fila esvaziar</text>

    <rect x="500" y="408" width="240" height="50" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="620" y="430" font-size="13" fill="#f4f7fa">uploadMetadata</text>
    <text x="620" y="448" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">sementes, offsets, candidatos</text>

    <rect x="500" y="480" width="240" height="50" rx="2" fill="#57708c" stroke="#6ad6b1" stroke-width="1.6"/>
    <text x="620" y="502" font-size="13" fill="#f4f7fa">seedAgents</text>
    <text x="620" y="520" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">posição e estado inicial</text>

    <rect x="500" y="552" width="240" height="38" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="620" y="576" font-size="13" fill="#f4f7fa">turno &#8592; 0</text>
  </g>

  <!-- ================= coluna C: o turno ================= -->
  <g font-family="Archivo, Lato, sans-serif" text-anchor="middle">
    <circle cx="960" cy="44" r="14" fill="#4b6079" stroke="#c5d2e0" stroke-width="1.6"/>
    <text x="960" y="49" font-size="13" font-weight="600" fill="#f4f7fa">B</text>

    <rect x="840" y="70" width="240" height="42" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="960" y="96" font-size="13" fill="#f4f7fa">Abrir MTLCommandBuffer</text>

    <rect x="840" y="134" width="240" height="50" rx="2" fill="#57708c" stroke="#7d94ad"/>
    <text x="960" y="156" font-size="13" fill="#f4f7fa">blit fillBuffer</text>
    <text x="960" y="174" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">zerar a máscara de infectados</text>

    <rect x="840" y="206" width="240" height="50" rx="2" fill="#57708c" stroke="#6ad6b1" stroke-width="1.6"/>
    <text x="960" y="228" font-size="13" fill="#f4f7fa">markInfected</text>
    <text x="960" y="246" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">1 thread por agente</text>

    <rect x="840" y="278" width="240" height="54" rx="2" fill="#57708c" stroke="#6ad6b1" stroke-width="2.2"/>
    <line x1="850" y1="278" x2="850" y2="332" stroke="#6ad6b1" stroke-width="1.4"/>
    <line x1="1070" y1="278" x2="1070" y2="332" stroke="#6ad6b1" stroke-width="1.4"/>
    <text x="960" y="300" font-size="13" fill="#f4f7fa">stepAgents</text>
    <text x="960" y="318" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">1 thread por agente</text>

    <rect x="840" y="354" width="240" height="44" rx="2" fill="#4b6079" stroke="#7d94ad"/>
    <text x="960" y="374" font-size="13" fill="#f4f7fa">commit</text>
    <text x="960" y="391" font-size="11" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">sem esperar a GPU</text>

    <rect x="840" y="420" width="240" height="42" rx="2" fill="#4b6079" stroke="#7d94ad"/>
    <text x="960" y="446" font-size="13" fill="#f4f7fa">turno &#8592; turno + 1</text>

    <circle cx="960" cy="492" r="14" fill="#4b6079" stroke="#c5d2e0" stroke-width="1.6"/>
    <text x="960" y="497" font-size="13" font-weight="600" fill="#f4f7fa">A</text>

    <text x="1104" y="270" font-size="10.5" text-anchor="start"
          font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">mesmo</text>
    <text x="1104" y="284" font-size="10.5" text-anchor="start"
          font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">encoder:</text>
    <text x="1104" y="298" font-size="10.5" text-anchor="start"
          font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#c5d2e0">barreira</text>
  </g>

  <g stroke="#c5d2e0" stroke-width="1.4" fill="none">
    <path d="M1086 216 L1096 216 L1096 322 L1086 322"/>
  </g>

  <g font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#c5d2e0">
    <text x="340" y="444">sim</text>
    <text x="232" y="510">não</text>
  </g>
</svg>
